[build-system]
requires = ["setuptools>=68", "wheel"]

[project]
name = "ciancheiltis-teanga"
version = "0.2.0"
description = "Ciancheiltis sister repo — teanga (language) surface for Irish + Celtic languages"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BUSL-1.1"}
authors = [
    {name = "Ciancheiltis Team", email = "dev@cianfhoghlaim.ie"},
]
dependencies = [
    "dlt>=1.30.0",
    "duckdb>=1.0.0",
    "datasets>=2.16.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "bs4>=0.0.2",
    "fasttext>=0.9.2",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "Babel>=2.14.0",
    "unidecode>=1.3.7",
]

[project.optional-dependencies]
baml = [
    "baml-py>=0.60.0",
]
agents = [
    "google-adk>=1.17.0",
    "pydantic-ai>=0.0.20",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
]
training = [
    "unsloth[colab-new]>=2026.8.19",
    "trl>=0.12.0",
    "peft>=0.12.0",
    "accelerate>=0.32.0",
    "bitsandbytes>=0.43.0",
]
all = [
    "ciancheiltis-teanga[baml,agents,training]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = ["src"]
