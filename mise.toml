# mise.toml — Ciancheiltis
# Per-repo task namespace (Phase 4 carve-out).
# Sibling of /Users/cianmacandeisigh/dev/ciandlithe/mise.toml + /Users/cianmacandeisigh/dev/cianfhoghlaim/mise.toml.

_.python.compile = true

[tasks.ciancheiltis]
description = "Ciancheiltis root: dev env + smoke test (alias → use :test, :lint, :typecheck, :openspec-validate, :smoke-all)"
run = "mise run ciancheiltis:test && mise run ciancheiltis:smoke-all"

[tasks."ciancheiltis:test"]
description = "Run the ciancheiltis smoke test"
run = "python3 -m pytest tests/dlt/test_imports.py -q"

[tasks."ciancheiltis:lint"]
description = "Lint the ciancheiltis dlt_sources tree"
run = "python3 -m compileall -q dlt_sources/"

[tasks."ciancheiltis:typecheck"]
description = "Type-check the ciancheiltis dlt_sources tree (best-effort, --ignore-missing-imports)"
run = "python3 -m mypy dlt_sources/ --ignore-missing-imports --no-error-summary || true"

[tasks."ciancheiltis:openspec-validate"]
description = "Validate every openspec change + every canonical spec (--strict)"
run = "openspec validate --all --strict"

[tasks."ciancheiltis:smoke-all"]
description = "Walk every dlt_sources/<subtree> via importlib.import_module; record OK/FAIL to stedding/sync-reports/dlt-smoke-run-*.json"
run = "python3 -m pytest tests/dlt/test_imports.py -q"
