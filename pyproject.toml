[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciancheiltis"
version = "0.1.0"
description = "Irish + Celtic languages + cultural-heritage data platform"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "dlt[duckdb,motherduck,filesystem]>=1.30.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dlt_sources"]
